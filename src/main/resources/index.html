<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kafka Live Bar Chart</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>

<body>
  <header>
    <h1>&#128202; Kafka Live Bar Chart</h1>
    <div id="status">
      <div id="dot" class="live"></div>
      <span id="status-text">Demo</span>
    </div>
  </header>

  <div class="stats-card">
    <div class="stat">
      <div class="val" id="n-cats">0</div>
      <div class="lbl">Domains</div>
    </div>
    <div class="stat">
      <div class="val" id="n-msgs">0</div>
      <div class="lbl">Messages received</div>
    </div>
    <div class="stat">
      <div class="val" id="max-v">—</div>
      <div class="lbl">Max value</div>
    </div>
  </div>

  <!--  Chart  -->
  <div class="panel" id="panel-chart">
    <div class="panel-header" onclick="togglePanel('panel-chart')">
      <span class="caret" id="caret-panel-chart">&#9660;</span>
      <span class="panel-title">&#128202; Bar plot</span>
      <span class="chart-info" id="chart-info"></span>
    </div>
    <div class="panel-body" id="body-panel-chart">
      <canvas id="chart"></canvas>
    </div>
  </div>

  <!--  Category list (collapsed by default)  -->
  <div class="panel collapsed" id="panel-cats">
    <div class="panel-header" onclick="togglePanel('panel-cats')">
      <span class="caret" id="caret-panel-cats">&#9660;</span>
      <span class="panel-title">&#128203; All domains</span>
      <span class="panel-badge badge-neutral" id="badge-cats" style="display:none"></span>
    </div>
    <div class="panel-body" id="body-panel-cats" style="display:none">
      <input type="text" id="cats-search" class="search-input" placeholder="Filter the domain list"
        oninput="renderCategoryList()" />
      <div class="cat-list" id="cat-list"></div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>

</html>
