x-data-stream: &data-stream
  image: data-stream:latest
  build:
    context: .
    dockerfile: Dockerfile
  depends_on:
    kafka-broker:
      condition: service_healthy
  networks:
    - pipeline-net
  restart: on-failure

services:
  kafka-init:
    image: busybox:latest
    volumes:
      - kafka-data:/var/lib/kafka/data
    command: [ "chown", "-R", "1000:1000", "/var/lib/kafka/data" ]
    networks:
      - pipeline-net

  kafka-broker:
    image: apache/kafka-native:4.0.0
    container_name: kafka-broker
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: OUTSIDE://0.0.0.0:9092,INSIDE://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: OUTSIDE://localhost:9092,INSIDE://kafka-broker:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: OUTSIDE:PLAINTEXT,INSIDE:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 9092 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - pipeline-net
    restart: unless-stopped

  data-stream-producer:
    <<: *data-stream
    container_name: data-stream-producer
    command: [ "producer.Main" ]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:29092

  data-stream-consumer:
    <<: *data-stream
    container_name: data-stream-consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-broker:29092
      KAFKA_GROUP_ID: data-stream-analytics-group

volumes:
  kafka-data:

networks:
  pipeline-net:
    driver: bridge
